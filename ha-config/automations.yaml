
- id: '3'
  alias: "Scenariusz 1a - Tryb nieobecności (potwierdzenie ręczne)"
  description: "Aktywacja trybu wychodzę - wyłącz TV/ekspres/oświetlenie"
  trigger:
    - platform: state
      entity_id: input_boolean.wychodze
      to: "on"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.tv_salon
          - input_boolean.tv_sypialnia_rodzicow
          - input_boolean.ekspres_kuchnia
          - input_boolean.oswietlenie_wiatrolap
          - input_boolean.oswietlenie_salon
          - input_boolean.oswietlenie_kuchnia
          - input_boolean.oswietlenie_korytarz_pietro
  mode: single

- id: '4'
  alias: "Scenariusz 1a - Ogrzewanie (potwierdzenie ręczne)"
  description: "Aktywacja trybu wychodzę - wyłącz oba grzejniki"
  trigger:
    - platform: state
      entity_id: input_boolean.wychodze
      to: "on"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.grzejnik_salon
          - input_boolean.grzejnik_korytarz_pietro
  mode: single

- id: '13'
  alias: "Scenariusz 1b - Wygaszanie stref przejściowych (wnioskowanie automatyczne)"
  description: "Drzwi zamknięte 30 min + brak ruchu na obu kondygnacjach - wyłącz oświetlenie wiatrołapu i korytarza"
  trigger:
    - platform: state
      entity_id: input_boolean.czujnik_drzwi_wejsciowe
      to: "off"
      for:
        minutes: 30
  condition:
    - condition: state
      entity_id: input_boolean.czujnik_ruchu_wiatrolap
      state: "off"
    - condition: state
      entity_id: input_boolean.czujnik_ruchu_korytarz_pietro
      state: "off"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.oswietlenie_wiatrolap
          - input_boolean.oswietlenie_korytarz_pietro
  mode: single

- id: '14'
  alias: "Scenariusz 1b - Ogrzewanie (wnioskowanie automatyczne)"
  description: "Ten sam warunek co scenariusz 1b - wyłącz oba grzejniki"
  trigger:
    - platform: state
      entity_id: input_boolean.czujnik_drzwi_wejsciowe
      to: "off"
      for:
        minutes: 30
  condition:
    - condition: state
      entity_id: input_boolean.czujnik_ruchu_wiatrolap
      state: "off"
    - condition: state
      entity_id: input_boolean.czujnik_ruchu_korytarz_pietro
      state: "off"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.grzejnik_salon
          - input_boolean.grzejnik_korytarz_pietro
  mode: single

# --- Scenariusz 2: oświetlenie na podstawie obecności ---
- id: '5'
  alias: "Scenariusz 2a - Oświetlenie Wiatrołap (ruch wykryty)"
  trigger:
    - platform: state
      entity_id: input_boolean.czujnik_ruchu_wiatrolap
      to: "on"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.oswietlenie_wiatrolap
  mode: single

- id: '6'
  alias: "Scenariusz 2b - Oświetlenie Wiatrołap (brak ruchu)"
  trigger:
    - platform: state
      entity_id: input_boolean.czujnik_ruchu_wiatrolap
      to: "off"
      for:
        minutes: 1
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.oswietlenie_wiatrolap
  mode: single

- id: '7'
  alias: "Scenariusz 2c - Oświetlenie Korytarz piętra (ruch wykryty)"
  trigger:
    - platform: state
      entity_id: input_boolean.czujnik_ruchu_korytarz_pietro
      to: "on"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.oswietlenie_korytarz_pietro
  mode: single

- id: '8'
  alias: "Scenariusz 2d - Oświetlenie Korytarz piętra (brak ruchu)"
  trigger:
    - platform: state
      entity_id: input_boolean.czujnik_ruchu_korytarz_pietro
      to: "off"
      for:
        minutes: 1
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.oswietlenie_korytarz_pietro
  mode: single

# --- Scenariusz 3: sterowanie ogrzewaniem ---
- id: '9'
  alias: "Scenariusz 3a - Ogrzewanie nocne wyłącz (22:00)"
  trigger:
    - platform: time
      at: "22:00:00"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.grzejnik_salon
          - input_boolean.grzejnik_korytarz_pietro
  mode: single

- id: '10'
  alias: "Scenariusz 3b - Ogrzewanie nocne włącz (06:00)"
  trigger:
    - platform: time
      at: "06:00:00"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id:
          - input_boolean.grzejnik_salon
          - input_boolean.grzejnik_korytarz_pietro
  mode: single

# --- Scenariusz 4: kontrola rodzicielska nad komputerem ---
- id: '11'
  alias: "Scenariusz 4a - Kontrola rodzicielska - włącz (16:00)"
  trigger:
    - platform: time
      at: "16:00:00"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.komputery_pokoj_dzieci
  mode: single

- id: '12'
  alias: "Scenariusz 4b - Kontrola rodzicielska - wyłącz (20:00)"
  trigger:
    - platform: time
      at: "20:00:00"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.komputery_pokoj_dzieci
  mode: single
